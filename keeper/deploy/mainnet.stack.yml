# Gamma keeper — Hydration MAINNET. Deploy as Swarmpit stack "gamma".
#
# One process, one signer, every vault in VAULTS_FILE. Image: keeper/ at the
# commit in the tag. The vault list is NOT in the image: it is the swarm config
# gamma_vaults_vN, created from keeper/deploy/vaults.mainnet.json (configs are
# immutable — bump N and repoint on every change):
#
#   docker config create gamma_vaults_v1 keeper/deploy/vaults.mainnet.json
#
#
#   cd gamma-hypervisor/keeper
#   docker build -t galacticcouncil/gamma-keeper:64f8637 .
#   docker push galacticcouncil/gamma-keeper:64f8637
#
# PRIVATE_KEY is inline by choice. Swarmpit renders stack env in its api and
# ui, and with several vaults on one signer this key holds rebalancers[vault]
# and advisors[vault] on every pool. Bounded on-chain (minInterval /
# maxTranslation / maxWidth, no withdraw), revocable via
# RebalanceProxy.setRebalancer, but only by referendum. PRIVATE_KEY_FILE with a
# docker secret keeps it out of the rendered env; setting both is a startup error.
services:
  keeper:
    # commit-tagged, never :latest — autoredeploy on a moving tag restarts the
    # keeper every ~60s and still looks healthy. keep autoredeploy OFF.
    image: galacticcouncil/gamma-keeper:64f8637
    environment:
      # --- global: one value for the whole process ---
      PRIVATE_KEY: '0x<64 hex — the keeper key for 0x0B0bE14C1158Ba09B720812e70F819366614Cb96>'
      RPC_URL: https://hdx.tarn.hydration.cloud
      POLL_INTERVAL_MS: '2000'
      CONFIRMATIONS: '3'
      GAS_LIMIT: '3000000'
      GAS_PRICE_MARKUP_PCT: '20'
      GAS_FLOOR_WEI: '1000000000000000'
      DRY_RUN: 'false'
      STARTUP_LOOKBACK_BLOCKS: '150000'
      INDEXER_URL: https://hydration-explorer.neckwork.net/api
      INDEXER_TIMEOUT_MS: '5000'
      MM_DATA_PROVIDER: '0xdf18300261edfF47b28c6a6adBCBCf468B52e5a5'

      # --- vaults: the mounted list, one self-contained entry per pool ---
      # every per-vault setting lives in deploy/vaults.mainnet.json, none here:
      # a vault key left in this env would become a default for every pool
      VAULTS_FILE: /run/vaults.json
    configs:
      - source: gamma_vaults_v1
        target: /run/vaults.json
    networks:
      - default
    logging:
      driver: json-file
      options:
        max-file: '5'
        max-size: 10m
    deploy:
      mode: replicated
      replicas: 1
      labels:
        com.hydration.role: gamma-keeper
      update_config:
        parallelism: 1
        order: stop-first
        delay: 5s
        failure_action: rollback
      restart_policy:
        condition: any
        delay: 15s
        window: 60s
      resources:
        reservations:
          cpus: '0.05'
          memory: 64M
        limits:
          cpus: '0.5'
          memory: 256M
  monitor:
    image: galacticcouncil/gamma-monitor:0.3.0
    environment:
      RPC_URL: https://hdx.tarn.hydration.cloud
      KEEPER: '0x0B0bE14C1158Ba09B720812e70F819366614Cb96'
      VAULT: '0xa206D0959813f17c17C87147271C49065438648A'
      POOL: '0x5C6208A3c316A801f8996750aA7b6f45Fc988548'
      CLEARING: '0x3541A3E5Db2d611904BE4F45A3CAFEA9A4df3e48'
      PRICE_FEED: '0xFBCa0A6dC5B74C042DF23025D99ef0F1fcAC6702'
      # Leave unset to log only; set it to actually alert.
      DISCORD_WEBHOOK: ''
      CHECK_INTERVAL_SECS: '300'
      REALERT_SECS: '21600'
      # Warn ABOVE the keeper's own floor, so there is time to act before it
      # stops. Measured costs: compound 643k gas ~0.0000039 WETH, rebalance
      # 815k ~0.0000049 — so 0.002 is weeks of runway, not hours.
      GAS_WARN_WEI: '2000000000000000'
      GAS_FLOOR_WEI: '1000000000000000'
      REBALANCE_PROXY: '0x8B7Dd119b7edb85D9cF166129DBec5D88DC78C94'
      # Liveness is "work that was DUE and did not happen", never "no recent
      # transactions" — a healthy keeper is silent for days. These must match
      # the keeper's own values or the check disagrees with what it is watching.
      REBALANCE_THRESHOLD_MULT: '11'
      MIN_INTERVAL_SECS: '21600'
      REBALANCE_GRACE_SECS: '7200'
      # Above this pool-vs-oracle gap the keeper is RIGHT to hold, so the
      # overdue check stands down rather than blaming it.
      ORACLE_MAX_DEV_TICKS: '50'
      # The keeper clamps the pool TWAP against the oracle, not spot — the
      # watchdog must build the same number or it disagrees with what it
      # watches. Mirror the keeper's values exactly.
      TWAP_WINDOW_SECS: '3600'
      MIN_TWAP_WINDOW_SECS: '3000'
      # Mirrors the keeper's LIMIT_REFRESH_TICKS: catches a one-sided limit
      # parked out of range while the base sits inside its drift threshold.
      LIMIT_REFRESH_TICKS: '120'
      DIVERGENCE_BPS: '200'
      STALE_SECONDS: '28800'
    networks:
      - default
    logging:
      driver: json-file
      options:
        max-file: '5'
        max-size: 10m
    deploy:
      mode: replicated
      replicas: 1
      labels:
        com.hydration.role: gamma-monitor
      restart_policy:
        condition: any
        delay: 15s
        window: 60s
      resources:
        reservations:
          cpus: '0.02'
          memory: 32M
        limits:
          cpus: '0.2'
          memory: 128M
networks:
  default:
    driver: overlay
configs:
  gamma_vaults_v1:
    external: true
