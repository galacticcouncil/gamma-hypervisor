[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
test = "test"
cache_path = "cache_forge"

# Fork caching configuration for faster test runs
rpc_storage_caching = { chains = "all", endpoints = "all" }
rpc_cache_dir = "cache_forge/rpc"
no_storage_caching = false
# Cache recent blocks for better performance with latest block forks
block_cache_size = 100

# Compiler settings matching hardhat config
solc_version = "0.7.6"
optimizer = true
optimizer_runs = 800
via_ir = false

# Additional compiler versions for legacy contracts
evm_version = "shanghai"
bytecode_hash = "none"
auto_detect_solc = true

# Remappings
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@uniswap/v3-core/=lib/v3-core/",
    "@uniswap/v3-periphery/=lib/v3-periphery/",
    "forge-std/=lib/forge-std/src/"
]

# RPC endpoints and network configurations
