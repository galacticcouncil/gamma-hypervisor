celo = "https://forno.celo.org"
bsc = "https://bsc-mainnet.nodereal.io/v1/c90506ed63514e5e8f9fcd7e7ea2aacd"
zkevm = "https://polygonzkevm-mainnet.g.alchemy.com/v2/6MaZoczRQ_jD1PEuDHSv818Yc7LUpUWM"
moonbeam = "https://moonbeam.api.onfinality.io/public"
