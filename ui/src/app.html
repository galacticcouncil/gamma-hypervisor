<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="gamma keeper: fleet, gates, history, economics. read-only." />
    <meta name="theme-color" content="#A8A8A8" />

    <!-- Favicon -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23fcfc54' /%3E%3C/svg%3E"
    />

    <!-- tuicss and the DOS font are vendored in static/tuicss and imported by app.css -->

    <!-- resolve the colour scheme before first paint; the theme store takes
         over after hydration. keep the id list in sync with stores/theme.js -->
    <script>
      try {
        var t = localStorage.getItem('gamma-ui-theme');
        if (
          ['ocean', 'borland', 'nc', 'cga', 'phosphor', 'amber', 'mono', 'paper'].indexOf(t) === -1
        ) {
          t = matchMedia('(prefers-color-scheme: light)').matches ? 'paper' : 'ocean';
        }
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>

    <!-- Inject SvelteKit head content -->
    %sveltekit.head%
  </head>
  <!-- the desktop dither is themed in app.css; tui-bg-blue-black would pin it blue -->
  <body>
    <!-- Inject rendered app content -->
    <div>%sveltekit.body%</div>
  </body>
</html>
